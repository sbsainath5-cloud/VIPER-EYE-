<section class="form-section">
  <h2 class="section-title" style="font-size: 1.6rem; margin-bottom: 25px;">Book Confidential Consultation</h2>
  <form action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="cb04a3e5-ef20-4d66-bb7d-d56cc2e1fb7f">
    <input type="hidden" name="subject" value="New Consultation Request - Viper Eye">
    <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>
    </div>
    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter your mobile number" required>
    </div>
    <div class="form-group">
      <label for="location">Location</label>
      <input type="text" id="location" name="location" placeholder="Enter your city / area" required>
    </div>
    <div class="form-group">
      <label for="service">Select Service</label>
      <select id="service" name="service" required>
        <option value="" disabled selected>Select a service</option>
        <option value="Background Verification">Background Verification</option>
        <option value="Pre-Matrimonial Investigation">Pre-Matrimonial Investigation</option>
        <option value="Post-Matrimonial Investigation">Post-Matrimonial Investigation</option>
        <option value="Employment Verification">Employment Verification</option>
        <option value="Tenant Verification">Tenant Verification</option>
        <option value="Corporate Investigation">Corporate Investigation</option>
        <option value="Other Confidential Service">Other Confidential Service</option>
      </select>
    </div>
    <div class="form-group">
      <label for="timing">Preferred Timing</label>
      <input type="text" id="timing" name="timing" placeholder="eg: Morning 10:00 AM - 12:00 PM" required>
    </div>
    <button type="submit" class="submit-btn">Send Message</button>
  </form>
</section>
<div class="form-group">
  <label style="display: flex; align-items: center; gap: 10px;">
    <input type="checkbox" name="terms" required style="width: auto;">
    I agree to the Terms and Conditions
  </label>
</div>
